# Dense Forest Configuration
# Use for closed-canopy forest simulation with high vegetation density

terrain:
  scale_factor: 0.5
  smooth_sigma: 0.0  # Less smoothing for varied terrain

density:
  tree: 82    # Dense tree coverage
  bush: 0     # Understory vegetation
  rock: 0     # Occasional rocks
  grass: 0   # Ground cover
  sand: 0      # Minimal sand
